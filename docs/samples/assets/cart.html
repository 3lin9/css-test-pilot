<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>demo</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; background: #f6f8fa; color: #1f2328; }
  .bar { background: #0969da; color: #fff; padding: 12px 24px; font-size: 18px; }
  .main { padding: 36px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 24px; max-width: 520px; }
  li { margin: 6px 0; list-style: none; }
  button { background: #1a7f37; color: #fff; border: none; border-radius: 6px; padding: 8px 18px; margin-top: 14px; }
</style>
</head>
<body>
<div class="bar">购物车</div>
<div class="main">
  <div class="card">
    <h2>购物车(2)</h2>
    <ul>
      <li>无线鼠标 × 1 · ¥199</li>
      <li>机械键盘 × 1 · ¥399</li>
    </ul>
    <button>去结算</button>
  </div>
</div>
</body>
</html>
