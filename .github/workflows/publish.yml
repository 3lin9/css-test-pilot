name: Publish CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # registry-url 会写入 ~/.npmrc 的 auth 占位,由 NODE_AUTH_TOKEN 注入
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 apps/cli/package.json 版本 $PKG_VERSION 不一致"
            exit 1
          fi

      - name: Build
        run: pnpm --filter csspilot build

      - name: Test
        run: pnpm test

      - name: E2E(Web 链路)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: Publish
        run: pnpm --filter csspilot publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
