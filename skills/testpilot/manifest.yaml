# TestPilot Skill 清单(源文件)
# `npx csspilot init` 会把整个 skills/testpilot/ 安装到业务项目 .agents/skills/testpilot/
id: testpilot
name: TestPilot
version: 0.8.0

description: >
  AI Native cross-platform testing skill.
  Miniapp deep-testing actions: mockWxApi / callWxApi / trigger / callMethod /
  setData / dataPath-assert / count-assert / attribute-assert / longpress /
  touch / scroll / swipeTo / slideTo / moveTo.

capabilities:
  - test-requirements-review
  - create-case
  - validate
  - discover
  - rehearse
  - ready-certificate
  - run
  - list
  - report
  - sync-metadata
  - doctor
  - ci-init

runtime:
  cli: csspilot

permissions:
  filesystem:
    read:
      - src/**
      - pages/**
      - tests/**
      - testpilot.yaml

    write:
      - tests/e2e/**
      - .testpilot/**

  shell:
    allow:
      - npx
      - pnpm
      - npm
      - csspilot
