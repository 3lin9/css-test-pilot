# csspilot Skill 清单(源文件)
# `npx csspilot init` 会把整个 skills/testpilot/ 安装到业务项目 .agents/skills/testpilot/
id: testpilot
name: csspilot
version: 0.9.7

description: >
  AI Native cross-platform testing skill.
  Cases are native scripts: Web uses Playwright, mini programs use
  miniprogram-automator, APIs use node:test. csspilot does not translate YAML.

capabilities:
  - test-requirements-review
  - create-case
  - validate
  - run
  - report
  - sync-metadata
  - doctor
  - update
  - ci-init

runtime:
  cli: csspilot

permissions:
  filesystem:
    read:
      - src/**
      - pages/**
      - tests/**
      - testpilot.yaml

    write:
      - tests/e2e/**
      - .testpilot/**

  shell:
    allow:
      - npx
      - pnpm
      - npm
      - csspilot
