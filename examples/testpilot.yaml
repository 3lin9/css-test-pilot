# TestPilot 项目配置示例(演示:mock-backend 黄金路径)
# 用法:复制到业务项目根目录并按需修改;值放 .env.testing,配置只放 ${VAR} 引用

version: 1

project:
  name: testpilot-examples

test:
  directory: tests/e2e

environment:
  default: test
  test:
    baseUrl: ${TEST_BASE_URL}

adapters:
  - playwright

web:
  baseUrl: ${TEST_BASE_URL}

api:
  baseUrl: ${API_BASE_URL}

